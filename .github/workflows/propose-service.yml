name: Propose a service

on:
  workflow_dispatch:
    inputs:
      name:
        description: Service name
        required: true
        type: string
      category:
        description: Service category
        required: true
        type: choice
        options:
          - databases
          - streaming
          - big-data
          - search
      description:
        description: Short service description
        required: true
        type: string
      url:
        description: HTTPS service URL (optional)
        required: false
        type: string
      image:
        description: Existing logo path, for example /img/services/example.svg (optional)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Validate submission and open pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVICE_NAME: ${{ inputs.name }}
          SERVICE_CATEGORY: ${{ inputs.category }}
          SERVICE_DESCRIPTION: ${{ inputs.description }}
          SERVICE_URL: ${{ inputs.url }}
          SERVICE_IMAGE: ${{ inputs.image }}
        run: node scripts/proposeService.mjs